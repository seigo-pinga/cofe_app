{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーヒー記録フォーム</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ Coffee Log</h1>
            <p>本日のコーヒーと、気象データを記録しましょう</p>
        </header>

        <main>
            <!-- 実際のDjangoフォーム（またはPOSTフォーム） -->
            <form method="POST" class="coffee-form">
                {% csrf_token %}
                
                <!-- 日時 -->
                <div class="form-group">
                    <label for="id_date">日時</label>
                    <input type="datetime-local" id="id_date" name="date" required>
                </div>

                <!-- 豆の量 -->
                <div class="form-group">
                    <label for="id_bean_amount">豆の量 (g)</label>
                    <input type="number" id="id_bean_amount" name="bean_amount" placeholder="例: 15" required>
                </div>

<!-- 挽き目（5段階のプルダウン） -->
                <div class="form-group">
                    <label for="id_bean_grind">挽き目 (Grind)</label>
                    <select id="id_bean_grind" name="bean_grind">
                        <option value="" disabled selected>選択してください</option>
                        <option value="極細挽き">極細挽き (Extra Fine)</option>
                        <option value="細挽き">細挽き (Fine)</option>
                        <option value="中細挽き">中細挽き (Medium-Fine)</option>
                        <option value="中挽き">中挽き (Medium)</option>
                        <option value="粗挽き">粗挽き (Coarse)</option>
                    </select>
                </div>

                <!-- 焙煎度（5段階のプルダウン） -->
                <div class="form-group">
                    <label for="id_bean_rost">焙煎度 (Roast)</label>
                    <select id="id_bean_rost" name="bean_rost">
                        <option value="" disabled selected>選択してください</option>
                        <option value="浅煎り">浅煎り (Light)</option>
                        <option value="中浅煎り">中浅煎り (Medium-Light)</option>
                        <option value="中煎り">中煎り (Medium)</option>
                        <option value="中深煎り">中深煎り (Medium-Dark)</option>
                        <option value="深煎り">深煎り (Dark)</option>
                    </select>
                </div>
                

                <!-- 気象データ（2カラムで並べるエリア） -->
                <div class="weather-grid">
                    <div class="form-group">
                        <label for="id_temperature">気温 (°C)</label>
                        <input type="number" id="id_temperature" name="temperature" value="{{ weather_data.temperature }}">
                    </div>

                    <div class="form-group">
                        <label for="id_humidity">湿度 (%)</label>
                        <input type="number" id="id_humidity" name="humidity" value="{{ weather_data.humidity }}">
                    </div>

                    <div class="form-group">
                        <label for="id_weather">天気</label>
                        <input type="text" id="id_weather" name="weather" value="{{ weather_data.weather }}">
                    </div>

                    <div class="form-group">
                        <label for="id_atmospheric_pressure">気圧 (hPa)</label>
                        <input type="number" id="id_atmospheric_pressure" name="atmospheric_pressure" value="{{ weather_data.atmospheric_pressure }}">
                    </div>
                </div>

                <!-- 送信ボタン -->
                <button type="submit" class="submit-btn">記録を保存する</button>
            </form>
        </main>
    </div>
</body>
</html>
